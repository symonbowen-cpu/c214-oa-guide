<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E141B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="C214" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<title>C214 OA Guide</title>
<style>
  :root { --bg:#0E141B; --ink:#E7EDF3; --muted:#8EA0B0; --line:#2A3846; --gold:#C6A15B; --gold2:#E4C98A; --green:#7DCEA0; --safe-b:env(safe-area-inset-bottom); }
  * { box-sizing:border-box; } html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; } body { min-height:100dvh; }
  button,input { font:inherit; color:inherit; } button { cursor:pointer; } .app { max-width:720px; margin:0 auto; padding:18px 16px 108px; }
  .kicker { letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-size:11px; font-weight:700; }
  h1 { font-family:Georgia,serif; font-weight:500; font-size:32px; line-height:1.05; margin:6px 0 8px; }
  h2 { font-family:Georgia,serif; font-weight:500; font-size:22px; margin:18px 0 8px; } h3 { font-size:15px; margin:0 0 6px; } p { color:#D5DEE6; line-height:1.45; }
  .small { color:var(--muted); font-size:13px; } .row { display:flex; gap:10px; }
  .card { background:linear-gradient(180deg,#1B2732,#151E27); border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; }
  .goldline { height:2px; width:46px; background:var(--gold); margin:8px 0 12px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:8px 12px; white-space:nowrap; }
  .chip.on { background:#2A2418; color:var(--gold2); border-color:#6D5830; } .tabs { display:flex; gap:8px; overflow:auto; }
  .nav { position:fixed; left:0; right:0; bottom:0; background:rgba(14,20,27,.94); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; padding:6px 8px calc(8px + var(--safe-b)); z-index:5; }
  .nav button { flex:1; background:none; border:0; color:var(--muted); padding:8px 2px; font-size:11px; } .nav button.on { color:var(--gold2); } .nav b { display:block; font-size:16px; font-weight:600; }
  .stat { flex:1; background:#17212B; border:1px solid var(--line); border-radius:14px; padding:12px; } .stat strong { display:block; font-family:Georgia,serif; font-size:22px; color:var(--gold2); }
  .rule { display:grid; grid-template-columns:88px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); } .tag { color:var(--gold); font-size:12px; font-weight:700; }
  details { border-bottom:1px solid var(--line); padding:10px 0; } summary { cursor:pointer; font-weight:650; } ul { margin:8px 0 0; padding-left:18px; } li { margin:6px 0; line-height:1.4; color:#D5DEE6; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; } input { width:100%; background:#0E141B; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .out { background:#132018; border:1px solid #2C5640; color:var(--green); border-radius:12px; padding:12px; margin-top:10px; }
  .primary { border:0; border-radius:12px; padding:12px 14px; background:var(--gold); color:#1B1408; font-weight:700; }
  .ghost { background:transparent; border:1px solid var(--line); border-radius:12px; padding:12px; color:var(--ink); }
  .flip { min-height:180px; border-radius:18px; padding:18px; background:#1C2834; border:1px solid #3A4C5C; display:flex; flex-direction:column; justify-content:space-between; }
  .flip .q { font-family:Georgia,serif; font-size:22px; line-height:1.25; } .hidden { display:none; }
  .formula { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--gold2); }
  .progress { height:8px; background:#243140; border-radius:99px; overflow:hidden; } .progress span { display:block; height:100%; background:linear-gradient(90deg,#8A6A2F,#E4C98A); }
</style></head><body><div class="app" id="app"></div><nav class="nav" id="nav"></nav><script src="app.js"></script></body></html>
